name: Update Stock Dashboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Fetch stock data
        env:
          TELKIT_USER: ${{ secrets.TELKIT_USER }}
          TELKIT_PASS: ${{ secrets.TELKIT_PASS }}
        run: python login_and_fetch.py

      - name: Upload debug screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: login-debug
          path: |
            login_debug.png
            login_debug.html
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stock_summary.json
          git diff --staged --quiet || git commit -m "재고 데이터 자동 갱신"
          git push
